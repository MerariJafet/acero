<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" font-family="Georgia, 'Times New Roman', serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b101c"/>
      <stop offset="0.55" stop-color="#101a2e"/>
      <stop offset="1" stop-color="#0b101c"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.42" r="0.75">
      <stop offset="0" stop-color="#e8b23c" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#e8b23c" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#c8863c"/>
      <stop offset="0.5" stop-color="#e8b23c"/>
      <stop offset="1" stop-color="#c8863c"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="360" fill="url(#bg)"/>
  <rect width="1200" height="360" fill="url(#glow)"/>
  <!-- constelación del Consejo: 16 nodos orbitando a Bohr -->
  <g stroke="#2a3550" stroke-width="1">
    <line x1="600" y1="178" x2="905" y2="88"/><line x1="600" y1="178" x2="985" y2="150"/>
    <line x1="600" y1="178" x2="1010" y2="228"/><line x1="600" y1="178" x2="940" y2="292"/>
    <line x1="600" y1="178" x2="845" y2="315"/><line x1="600" y1="178" x2="295" y2="88"/>
    <line x1="600" y1="178" x2="215" y2="150"/><line x1="600" y1="178" x2="190" y2="228"/>
    <line x1="600" y1="178" x2="260" y2="292"/><line x1="600" y1="178" x2="355" y2="315"/>
    <line x1="600" y1="178" x2="450" y2="62"/><line x1="600" y1="178" x2="600" y2="44"/>
    <line x1="600" y1="178" x2="750" y2="62"/><line x1="600" y1="178" x2="480" y2="318"/>
    <line x1="600" y1="178" x2="720" y2="318"/>
  </g>
  <g fill="#101a2e" stroke="#3a4a6b" stroke-width="1.5">
    <circle cx="905" cy="88" r="17"/><circle cx="985" cy="150" r="17"/>
    <circle cx="1010" cy="228" r="17"/><circle cx="940" cy="292" r="17"/>
    <circle cx="845" cy="315" r="17"/><circle cx="295" cy="88" r="17"/>
    <circle cx="215" cy="150" r="17"/><circle cx="190" cy="228" r="17"/>
    <circle cx="260" cy="292" r="17"/><circle cx="355" cy="315" r="17"/>
    <circle cx="450" cy="62" r="17"/><circle cx="600" cy="44" r="17"/>
    <circle cx="750" cy="62" r="17"/><circle cx="480" cy="318" r="17"/>
    <circle cx="720" cy="318" r="17"/>
  </g>
  <g font-size="13" fill="#93a1bd" text-anchor="middle">
    <text x="905" y="93">🜁</text><text x="985" y="155">∴</text><text x="1010" y="233">λ</text>
    <text x="940" y="297">Σ</text><text x="845" y="320">π</text><text x="295" y="93">∞</text>
    <text x="215" y="155">√</text><text x="190" y="233">≡</text><text x="260" y="297">∂</text>
    <text x="355" y="320">ℵ</text><text x="450" y="67">φ</text><text x="600" y="49">ζ</text>
    <text x="750" y="67">∮</text><text x="480" y="323">Δ</text><text x="720" y="323">Ω</text>
  </g>
  <!-- Bohr: el director -->
  <circle cx="600" cy="178" r="30" fill="#1b2438" stroke="url(#gold)" stroke-width="2.5"/>
  <text x="600" y="187" font-size="22" text-anchor="middle" fill="#e8b23c">🎩</text>
  <!-- título -->
  <text x="600" y="120" font-size="64" text-anchor="middle" fill="#e8edf7" letter-spacing="14" font-weight="bold">A C E R O</text>
  <text x="600" y="252" font-size="21" text-anchor="middle" fill="#cfd8ea" font-style="italic">Un consejo de 16 científicos autónomos que investiga de verdad</text>
  <text x="600" y="282" font-size="15" text-anchor="middle" fill="#93a1bd">conjetura → literatura → chispa → experimento → prueba mecánica → crítica hostil → veredicto honesto</text>
  <rect x="440" y="304" width="320" height="26" rx="13" fill="none" stroke="#54c08a" stroke-width="1.2"/>
  <text x="600" y="321" font-size="13.5" text-anchor="middle" fill="#54c08a">0 falsos positivos en 50 problemas abiertos atacados</text>
</svg>
