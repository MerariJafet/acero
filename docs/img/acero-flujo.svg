<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 430" font-family="Georgia, 'Times New Roman', serif">
  <defs>
    <linearGradient id="bg2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0b101c"/><stop offset="1" stop-color="#0e1524"/>
    </linearGradient>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#e8b23c"/>
    </marker>
    <marker id="ar2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#5b8def"/>
    </marker>
  </defs>
  <rect width="1200" height="430" fill="url(#bg2)"/>
  <text x="600" y="42" font-size="26" text-anchor="middle" fill="#e8edf7" font-weight="bold">Bohr v2 — el director que DECIDE jugada a jugada</text>
  <text x="600" y="66" font-size="14" text-anchor="middle" fill="#93a1bd" font-style="italic">no es un guion: mira los resultados reales y elige — repetir, pedir otra opinión, reformular, o cerrar honesto</text>

  <!-- Bohr al centro -->
  <rect x="490" y="180" width="220" height="76" rx="14" fill="#1b2438" stroke="#e8b23c" stroke-width="2.5"/>
  <text x="600" y="212" font-size="19" text-anchor="middle" fill="#e8b23c" font-weight="bold">🎩 BOHR</text>
  <text x="600" y="236" font-size="12.5" text-anchor="middle" fill="#cfd8ea">observa → razona → decide → registra el porqué</text>

  <!-- jugadas alrededor -->
  <g font-size="13.5" text-anchor="middle">
    <rect x="60"  y="110" width="180" height="52" rx="10" fill="#101a2e" stroke="#3a4a6b"/>
    <text x="150" y="131" fill="#e8edf7">📚 Hipatia</text><text x="150" y="150" fill="#93a1bd" font-size="11.5">¿ya se hizo? (DOIs reales)</text>
    <rect x="60"  y="264" width="180" height="52" rx="10" fill="#101a2e" stroke="#3a4a6b"/>
    <text x="150" y="285" fill="#e8edf7">🔨 Popper</text><text x="150" y="304" fill="#93a1bd" font-size="11.5">contraejemplos verificados</text>
    <rect x="330" y="90"  width="180" height="52" rx="10" fill="#101a2e" stroke="#3a4a6b"/>
    <text x="420" y="111" fill="#e8edf7">💡 Ramanujan</text><text x="420" y="130" fill="#93a1bd" font-size="11.5">chispas «¿y si sí?»</text>
    <rect x="690" y="90"  width="180" height="52" rx="10" fill="#101a2e" stroke="#3a4a6b"/>
    <text x="780" y="111" fill="#e8edf7">🔧 Turing</text><text x="780" y="130" fill="#93a1bd" font-size="11.5">programa · instala · repara · HORAS</text>
    <rect x="960" y="110" width="180" height="52" rx="10" fill="#101a2e" stroke="#3a4a6b"/>
    <text x="1050" y="131" fill="#e8edf7">⚖ Gödel/Euclides</text><text x="1050" y="150" fill="#93a1bd" font-size="11.5">prueba mecánica (Z3/sympy)</text>
    <rect x="960" y="264" width="180" height="52" rx="10" fill="#101a2e" stroke="#3a4a6b"/>
    <text x="1050" y="285" fill="#e8edf7">🦉 Aristóteles</text><text x="1050" y="304" fill="#93a1bd" font-size="11.5">revisor hostil (2ª opinión)</text>
    <rect x="330" y="330" width="180" height="52" rx="10" fill="#101a2e" stroke="#3a4a6b"/>
    <text x="420" y="351" fill="#e8edf7">🔥 Kepler</text><text x="420" y="370" fill="#93a1bd" font-size="11.5">anomalías → hipótesis nuevas</text>
    <rect x="690" y="330" width="180" height="52" rx="10" fill="#101a2e" stroke="#54c08a"/>
    <text x="780" y="351" fill="#e8edf7">📜 Gauss</text><text x="780" y="370" fill="#54c08a" font-size="11.5">dossier — techo: revisión HUMANA</text>
  </g>

  <!-- flechas Bohr ↔ jugadas -->
  <g stroke="#e8b23c" stroke-width="1.6" fill="none">
    <path d="M492 205 L 244 145" marker-end="url(#ar)"/>
    <path d="M492 232 L 244 285" marker-end="url(#ar)"/>
    <path d="M520 182 L 445 146" marker-end="url(#ar)"/>
    <path d="M680 182 L 755 146" marker-end="url(#ar)"/>
    <path d="M708 205 L 956 145" marker-end="url(#ar)"/>
    <path d="M708 232 L 956 285" marker-end="url(#ar)"/>
    <path d="M520 254 L 445 328" marker-end="url(#ar)"/>
    <path d="M680 254 L 755 328" marker-end="url(#ar)"/>
  </g>
  <!-- retorno: todo vuelve a Bohr -->
  <g stroke="#5b8def" stroke-width="1.3" fill="none" stroke-dasharray="5 4">
    <path d="M240 132 C 380 160, 430 175, 488 192" marker-end="url(#ar2)"/>
    <path d="M958 132 C 820 160, 770 175, 712 192" marker-end="url(#ar2)"/>
  </g>
  <text x="600" y="292" font-size="12" text-anchor="middle" fill="#5b8def" font-style="italic">todo resultado VERIFICADO vuelve al director…</text>

  <!-- pie: constitución -->
  <rect x="150" y="398" width="900" height="1" fill="#2a3550"/>
  <text x="600" y="420" font-size="13" text-anchor="middle" fill="#93a1bd">Constitución: jamás declarar resuelto un problema abierto · texto de LLM no es evidencia · la validación final siempre es humana</text>
</svg>
