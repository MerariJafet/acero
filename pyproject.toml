[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "acero"
version = "2.0.0-rc1"
description = "ACERO — Adaptive Computational Engine for Research and Epistemic Reasoning"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
authors = [{ name = "Merari Jafet" }]
dependencies = [
    "pydantic>=2.5",
    "sqlalchemy>=2.0",
    "fastapi>=0.110",
    "uvicorn>=0.27",
    "typer>=0.9",
    "structlog>=24.1",
    "pyyaml>=6.0",
    "httpx>=0.27",
    "numpy>=1.26",
    "scipy>=1.11",
    "sympy>=1.12",
    "scikit-learn>=1.3",
    "pandas>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=4.1",
    "hypothesis>=6.90",
    "ruff>=0.3",
    "mypy>=1.8",
]

[project.scripts]
acero = "acero.cli.main:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
acero = ["py.typed"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"
markers = [
    "science: scientific-integrity tests (preregistration, reproducibility, provenance)",
    "security: sandbox and access-control tests",
    "integration: cross-module flows",
    "slow: longer running",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
# E501: long lines tolerated. UP042: (str, Enum) kept intentionally for Pydantic
# JSON serialisation compatibility rather than switching to StrEnum.
ignore = ["E501", "UP042"]

[tool.mypy]
python_version = "3.12"
packages = ["acero"]
ignore_missing_imports = true
warn_unused_ignores = false
