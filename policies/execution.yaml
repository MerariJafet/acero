# ACERO code-execution (sandbox) policy.
version: 1
policy: execution

sandbox:
  default_backend: subprocess      # subprocess | docker
  network: disabled                # network OFF by default inside sandbox
  filesystem: workspace_only       # writes confined to the run's workspace dir
  allow_secrets: false             # env secrets are stripped before execution
  timeout_sec: 30
  memory_mb: 1024
  cpu_seconds: 30
  max_output_bytes: 5000000

forbidden_patterns:
  # Refused before execution (defense in depth; the sandbox also isolates).
  - "rm -rf"
  - "os.system"          # flagged, not silently allowed; used only for static screening
  - "subprocess.Popen"
  - "socket."
  - "requests.get"
  - "urllib.request"
  - "shutil.rmtree"
  - "__import__('os')"
  - "eval("
  - "exec("
